name: Update lotto stats

on:
  schedule:
    # Daily at 04:00 UTC (~07:00 Israel time) — after Tue/Sat night draws are published
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/website-app-development-68IT9

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download fresh lotto CSV
        run: |
          set -uo pipefail
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          TARGET="https://www.pais.co.il/Lotto/lotto_resultsDownload.aspx"

          urls=(
            "$TARGET"
            "https://api.allorigins.win/raw?url=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$TARGET")"
            "https://api.codetabs.com/v1/proxy/?quest=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$TARGET")"
            "https://corsproxy.io/?$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$TARGET")"
          )

          for url in "${urls[@]}"; do
            echo "Trying: $url"
            if curl -sSf --max-time 60 -A "$UA" -o public/lotto-history.csv.new "$url"; then
              if [ -s public/lotto-history.csv.new ] && head -c 200 public/lotto-history.csv.new | grep -q ','; then
                mv public/lotto-history.csv.new public/lotto-history.csv
                echo "✓ Got CSV from: $url"
                exit 0
              fi
            fi
            rm -f public/lotto-history.csv.new
          done

          echo "All sources failed; keeping existing CSV."
          exit 0

      - name: Scrape latest jackpot info
        run: python3 scripts/scrape_jackpot.py || true

      - name: Rebuild stats JSON
        run: python3 scripts/build_stats.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name 'lotto-bot'
          git config user.email 'lotto-bot@users.noreply.github.com'
          git add public/lotto-history.csv public/lotto-stats.json public/lotto-jackpot.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          LATEST=$(python3 -c "import json; d=json.load(open('public/lotto-stats.json')); print(f\"#{d['latestDraw']} ({d['lastDate']})\")")
          git commit -m "auto: refresh lotto stats — latest $LATEST"
          git push
