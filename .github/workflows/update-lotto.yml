name: Update lotto stats

on:
  schedule:
    # Daily at 04:00 UTC (~07:00 Israel time) — after Tue/Sat night draws are published
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/website-app-development-68IT9

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download fresh lotto CSV from pais.co.il
        run: |
          set -euo pipefail
          curl -sSf -A "Mozilla/5.0 (compatible; lotto-stats-updater)" \
            -o public/lotto-history.csv.new \
            https://www.pais.co.il/Lotto/lotto_resultsDownload.aspx
          test -s public/lotto-history.csv.new
          mv public/lotto-history.csv.new public/lotto-history.csv

      - name: Scrape latest jackpot info
        run: |
          python3 scripts/scrape_jackpot.py || echo "Jackpot scrape failed; continuing"

      - name: Rebuild stats JSON
        run: python3 scripts/build_stats.py

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name 'lotto-bot'
          git config user.email 'lotto-bot@users.noreply.github.com'
          git add public/lotto-history.csv public/lotto-stats.json public/lotto-jackpot.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          LATEST=$(python3 -c "import json; d=json.load(open('public/lotto-stats.json')); print(f\"#{d['latestDraw']} ({d['lastDate']})\")")
          git commit -m "auto: refresh lotto stats — latest $LATEST"
          git push
