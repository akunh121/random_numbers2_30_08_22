<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="מחולל מספרי לוטו - 6 מספרים רגילים ומספר חזק. מבוסס על הגרלה אקראית מאובטחת.">
  <title>מחולל לוטו - 6 מספרים + חזק</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --surface: rgba(255, 255, 255, 0.06);
      --surface-strong: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-2: #ec4899;
      --strong: #f59e0b;
      --strong-2: #ef4444;
      --success: #10b981;
      --danger: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body { margin: 0; padding: 0; min-height: 100%; }

    body {
      font-family: 'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 800px at 90% -10%, rgba(99, 102, 241, 0.25), transparent 60%),
                  radial-gradient(900px 600px at -10% 110%, rgba(236, 72, 153, 0.22), transparent 60%),
                  linear-gradient(180deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; }

    header { text-align: center; margin-bottom: 32px; }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }

    .logo .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 12px var(--success);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    h1 {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 800;
      margin: 0 0 8px;
      background: linear-gradient(135deg, #fff 0%, #c7d2fe 50%, #f9a8d4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }

    .subtitle { color: var(--text-muted); font-size: 16px; margin: 0; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }

    .result-card {
      text-align: center;
      padding: 32px 24px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(236, 72, 153, 0.15));
      border-color: rgba(99, 102, 241, 0.3);
    }

    .result-section { margin-bottom: 24px; }
    .result-section:last-child { margin-bottom: 0; }

    .result-label {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .result-numbers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 64px;
      align-items: center;
    }

    .result-numbers:empty::before {
      content: '—';
      font-size: 40px;
      color: var(--text-muted);
      opacity: 0.4;
    }

    .ball {
      width: 56px;
      height: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #e2e8f0 60%, #94a3b8);
      color: #0f172a;
      box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.2),
                  0 6px 14px rgba(0, 0, 0, 0.4);
      animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-variant-numeric: tabular-nums;
    }

    .ball.strong {
      background: radial-gradient(circle at 30% 30%, #fde68a, var(--strong) 60%, var(--strong-2));
      color: #fff;
      box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.25),
                  0 8px 22px rgba(245, 158, 11, 0.5);
      width: 64px;
      height: 64px;
      font-size: 24px;
    }

    @keyframes pop {
      0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
      60% { transform: scale(1.1) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .copy-btn {
      font-size: 13px;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
      margin-top: 18px;
    }

    .copy-btn:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .copy-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .settings-toggle {
      width: 100%;
      background: transparent;
      color: var(--text-muted);
      border: none;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
    }

    .settings-toggle:hover { color: var(--text); }

    .settings-toggle .chevron {
      transition: transform var(--transition);
      display: inline-block;
    }

    .settings.open + .settings-toggle .chevron,
    .settings-toggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }

    .settings {
      display: none;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    .settings.open { display: block; }

    .settings-group { margin-bottom: 18px; }
    .settings-group:last-child { margin-bottom: 0; }

    .settings-group-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label { font-size: 13px; font-weight: 500; color: var(--text-muted); }

    input[type="number"] {
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      outline: none;
      transition: var(--transition);
      width: 100%;
      direction: ltr;
      text-align: right;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
      background: rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .actions { display: flex; gap: 12px; flex-wrap: wrap; }

    button.primary, button.secondary {
      flex: 1;
      min-width: 140px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid transparent;
    }

    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
    }

    button.primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(99, 102, 241, 0.45);
    }

    button.primary:active:not(:disabled) { transform: translateY(0); }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

    button.secondary {
      background: var(--surface-strong);
      color: var(--text);
      border-color: var(--border);
    }

    button.secondary:hover { background: rgba(255, 255, 255, 0.14); }

    .error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    .error.show { display: block; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .history-header h2 { margin: 0; font-size: 18px; font-weight: 600; }

    .clear-btn {
      font-size: 13px;
      background: transparent;
      color: var(--text-muted);
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 6px 10px;
      border-radius: 6px;
      transition: var(--transition);
    }

    .clear-btn:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 360px;
      overflow-y: auto;
    }

    .history-list::-webkit-scrollbar { width: 6px; }
    .history-list::-webkit-scrollbar-track { background: transparent; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius-sm);
      font-size: 14px;
      gap: 12px;
    }

    .history-balls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }

    .mini-ball {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1);
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    .mini-ball.strong {
      background: radial-gradient(circle at 30% 30%, #fde68a, var(--strong) 60%, var(--strong-2));
      color: #fff;
    }

    .history-item .time {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .empty-history {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }

    footer {
      text-align: center;
      margin-top: 32px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--success);
      color: white;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
      opacity: 0;
      transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 480px) {
      .container { padding: 20px 14px 40px; }
      .card { padding: 20px 16px; }
      .actions { flex-direction: column; }
      button.primary, button.secondary { width: 100%; }
      .ball { width: 48px; height: 48px; font-size: 18px; }
      .ball.strong { width: 54px; height: 54px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="logo">
        <span class="dot"></span>
        <span>מחולל לוטו</span>
      </div>
      <h1>6 מספרים + חזק</h1>
      <p class="subtitle">הגרלת מספרים אקראית בסגנון מפעל הפיס</p>
    </header>

    <section class="card result-card" aria-live="polite">
      <div class="result-section">
        <div class="result-label">המספרים</div>
        <div class="result-numbers" id="results"></div>
      </div>
      <div class="result-section">
        <div class="result-label">המספר החזק</div>
        <div class="result-numbers" id="strongResult"></div>
      </div>
      <button class="copy-btn" id="copyBtn" disabled aria-label="העתק תוצאה">העתק</button>
    </section>

    <section class="card">
      <div class="error" id="error" role="alert"></div>

      <div class="actions">
        <button class="primary" id="generateBtn" type="button">הגרל</button>
        <button class="secondary" id="resetBtn" type="button">איפוס</button>
      </div>

      <div class="settings" id="settings">
        <div class="settings-group">
          <div class="settings-group-title">המספרים הרגילים</div>
          <div class="form-grid">
            <div class="field">
              <label for="mainCount">כמות</label>
              <input type="number" id="mainCount" value="6" min="1" max="20" inputmode="numeric">
            </div>
            <div class="field">
              <label for="mainMin">מינימום</label>
              <input type="number" id="mainMin" value="1" inputmode="numeric">
            </div>
            <div class="field">
              <label for="mainMax">מקסימום</label>
              <input type="number" id="mainMax" value="37" inputmode="numeric">
            </div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">המספר החזק</div>
          <div class="form-grid">
            <div class="field">
              <label for="strongMin">מינימום</label>
              <input type="number" id="strongMin" value="1" inputmode="numeric">
            </div>
            <div class="field">
              <label for="strongMax">מקסימום</label>
              <input type="number" id="strongMax" value="7" inputmode="numeric">
            </div>
          </div>
        </div>
      </div>

      <button class="settings-toggle" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settings">
        <span id="settingsToggleLabel">הגדרות מתקדמות</span>
        <span class="chevron">▼</span>
      </button>
    </section>

    <section class="card">
      <div class="history-header">
        <h2>היסטוריה</h2>
        <button class="clear-btn" id="clearHistoryBtn" type="button">נקה</button>
      </div>
      <ul class="history-list" id="history"></ul>
      <div class="empty-history" id="emptyHistory">עדיין לא הוגרלו מספרים</div>
    </section>

    <footer>
      נבנה בעברית · מבוסס על <code>crypto.getRandomValues</code>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function() {
      'use strict';

      const STORAGE_KEY = 'lotto_history_v1';
      const MAX_HISTORY = 20;

      const els = {
        mainCount: document.getElementById('mainCount'),
        mainMin: document.getElementById('mainMin'),
        mainMax: document.getElementById('mainMax'),
        strongMin: document.getElementById('strongMin'),
        strongMax: document.getElementById('strongMax'),
        generate: document.getElementById('generateBtn'),
        reset: document.getElementById('resetBtn'),
        results: document.getElementById('results'),
        strongResult: document.getElementById('strongResult'),
        copy: document.getElementById('copyBtn'),
        error: document.getElementById('error'),
        history: document.getElementById('history'),
        emptyHistory: document.getElementById('emptyHistory'),
        clearHistory: document.getElementById('clearHistoryBtn'),
        toast: document.getElementById('toast'),
        settings: document.getElementById('settings'),
        settingsToggle: document.getElementById('settingsToggle'),
        settingsToggleLabel: document.getElementById('settingsToggleLabel'),
      };

      const DEFAULTS = { mainCount: 6, mainMin: 1, mainMax: 37, strongMin: 1, strongMax: 7 };

      let lastResult = null;
      let history = loadHistory();

      function loadHistory() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch { return []; }
      }

      function saveHistory() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch {}
      }

      function showError(msg) {
        els.error.textContent = msg;
        els.error.classList.add('show');
      }

      function clearError() {
        els.error.classList.remove('show');
        els.error.textContent = '';
      }

      function showToast(msg) {
        els.toast.textContent = msg;
        els.toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => els.toast.classList.remove('show'), 1800);
      }

      function randomInt(min, max) {
        const range = max - min + 1;
        const maxUint = 0xFFFFFFFF;
        const limit = Math.floor((maxUint + 1) / range) * range;
        const buf = new Uint32Array(1);
        let v;
        do {
          crypto.getRandomValues(buf);
          v = buf[0];
        } while (v >= limit);
        return min + (v % range);
      }

      function uniqueNumbers(count, min, max) {
        const range = max - min + 1;
        if (count > range / 2) {
          const pool = [];
          for (let i = min; i <= max; i++) pool.push(i);
          for (let i = pool.length - 1; i > 0; i--) {
            const j = randomInt(0, i);
            [pool[i], pool[j]] = [pool[j], pool[i]];
          }
          return pool.slice(0, count);
        }
        const seen = new Set();
        const out = [];
        while (out.length < count) {
          const v = randomInt(min, max);
          if (!seen.has(v)) { seen.add(v); out.push(v); }
        }
        return out;
      }

      function generate() {
        clearError();

        const mainCount = parseInt(els.mainCount.value, 10);
        const mainMin = parseInt(els.mainMin.value, 10);
        const mainMax = parseInt(els.mainMax.value, 10);
        const strongMin = parseInt(els.strongMin.value, 10);
        const strongMax = parseInt(els.strongMax.value, 10);

        if ([mainCount, mainMin, mainMax, strongMin, strongMax].some(v => !Number.isFinite(v))) {
          showError('אנא הזן ערכים תקינים בכל השדות.');
          return;
        }
        if (mainMin > mainMax || strongMin > strongMax) {
          showError('הערך המינימלי לא יכול להיות גדול מהמקסימלי.');
          return;
        }
        if (mainCount < 1 || mainCount > 20) {
          showError('כמות המספרים חייבת להיות בין 1 ל-20.');
          return;
        }
        const mainRange = mainMax - mainMin + 1;
        if (mainCount > mainRange) {
          showError(`לא ניתן להגריל ${mainCount} מספרים ייחודיים בטווח ${mainMin}-${mainMax}.`);
          return;
        }

        const main = uniqueNumbers(mainCount, mainMin, mainMax).sort((a, b) => a - b);
        const strong = randomInt(strongMin, strongMax);

        lastResult = { main, strong, time: Date.now() };
        renderResult(lastResult);
        addToHistory(lastResult);
      }

      function renderResult(result) {
        els.results.innerHTML = '';
        result.main.forEach((n, i) => {
          const ball = document.createElement('span');
          ball.className = 'ball';
          ball.textContent = n.toLocaleString('he-IL');
          ball.style.animationDelay = `${i * 60}ms`;
          els.results.appendChild(ball);
        });

        els.strongResult.innerHTML = '';
        const strongBall = document.createElement('span');
        strongBall.className = 'ball strong';
        strongBall.textContent = result.strong.toLocaleString('he-IL');
        strongBall.style.animationDelay = `${result.main.length * 60}ms`;
        els.strongResult.appendChild(strongBall);

        els.copy.disabled = false;
      }

      function addToHistory(entry) {
        history.unshift(entry);
        if (history.length > MAX_HISTORY) history.length = MAX_HISTORY;
        saveHistory();
        renderHistory();
      }

      function renderHistory() {
        els.history.innerHTML = '';
        if (history.length === 0) {
          els.emptyHistory.style.display = 'block';
          els.history.style.display = 'none';
          return;
        }
        els.emptyHistory.style.display = 'none';
        els.history.style.display = 'flex';

        history.forEach(entry => {
          const li = document.createElement('li');
          li.className = 'history-item';

          const balls = document.createElement('div');
          balls.className = 'history-balls';

          entry.main.forEach(n => {
            const b = document.createElement('span');
            b.className = 'mini-ball';
            b.textContent = n;
            balls.appendChild(b);
          });

          const sep = document.createElement('span');
          sep.style.color = 'var(--text-muted)';
          sep.style.alignSelf = 'center';
          sep.textContent = '+';
          balls.appendChild(sep);

          const strong = document.createElement('span');
          strong.className = 'mini-ball strong';
          strong.textContent = entry.strong;
          balls.appendChild(strong);

          const time = document.createElement('span');
          time.className = 'time';
          time.textContent = formatTime(entry.time);

          li.appendChild(balls);
          li.appendChild(time);
          els.history.appendChild(li);
        });
      }

      function formatTime(ts) {
        const d = new Date(ts);
        const diff = (Date.now() - ts) / 1000;
        if (diff < 60) return 'עכשיו';
        if (diff < 3600) return `לפני ${Math.floor(diff / 60)} ד׳`;
        if (diff < 86400) return `לפני ${Math.floor(diff / 3600)} ש׳`;
        return d.toLocaleDateString('he-IL');
      }

      function resetForm() {
        els.mainCount.value = DEFAULTS.mainCount;
        els.mainMin.value = DEFAULTS.mainMin;
        els.mainMax.value = DEFAULTS.mainMax;
        els.strongMin.value = DEFAULTS.strongMin;
        els.strongMax.value = DEFAULTS.strongMax;
        clearError();
        els.results.innerHTML = '';
        els.strongResult.innerHTML = '';
        els.copy.disabled = true;
        lastResult = null;
      }

      async function copyResult() {
        if (!lastResult) return;
        const text = `${lastResult.main.join(', ')} + ${lastResult.strong}`;
        try {
          await navigator.clipboard.writeText(text);
          showToast('הועתק ללוח');
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); showToast('הועתק ללוח'); } catch {}
          document.body.removeChild(ta);
        }
      }

      function clearHistory() {
        history = [];
        saveHistory();
        renderHistory();
      }

      function toggleSettings() {
        const open = els.settings.classList.toggle('open');
        els.settingsToggle.setAttribute('aria-expanded', String(open));
        els.settingsToggleLabel.textContent = open ? 'סגור הגדרות' : 'הגדרות מתקדמות';
      }

      els.generate.addEventListener('click', generate);
      els.reset.addEventListener('click', resetForm);
      els.copy.addEventListener('click', copyResult);
      els.clearHistory.addEventListener('click', clearHistory);
      els.settingsToggle.addEventListener('click', toggleSettings);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.target.matches('button')) {
          e.preventDefault();
          generate();
        }
      });

      renderHistory();
    })();
  </script>
</body>
</html>
